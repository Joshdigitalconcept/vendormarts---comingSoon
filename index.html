<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VendorMart — Coming Soon</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet"/>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23e85d75'/%3E%3Cpath d='M18 20 14 28v22a3 3 0 0 0 3 3h30a3 3 0 0 0 3-3V28l-4-8Z' fill='none' stroke='white' stroke-width='2.5' stroke-linejoin='round'/%3E%3C/svg%3E"/>

  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    :root {
      --grad-start: #f4776a;
      --grad-mid: #e8556a;
      --grad-end: #c94080;
      --white: #ffffff;
      --white-60: rgba(255,255,255,0.6);
      --white-30: rgba(255,255,255,0.3);
      --white-15: rgba(255,255,255,0.15);
      --white-08: rgba(255,255,255,0.08);
      --dark: #1a0a10;
    }

    html, body {
      width:100%; height:100%;
      font-family: 'Jost', sans-serif;
    }

    body {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, var(--grad-start) 0%, var(--grad-mid) 50%, var(--grad-end) 100%);
      position: relative;
      overflow: hidden;
    }

    /* Soft noise overlay */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.08'/%3E%3C/svg%3E");
      opacity: 0.35;
      pointer-events: none;
      z-index: 1;
    }

    /* Subtle light orb */
    body::after {
      content: '';
      position: fixed;
      width: 700px; height: 700px;
      background: radial-gradient(circle, rgba(255,255,255,0.12) 0%, transparent 65%);
      top: -200px; left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 1;
    }

    .container {
      position: relative; z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: clamp(32px, 6vw, 60px) clamp(24px, 5vw, 48px);
      width: 100%;
      max-width: 680px;
      animation: fadeUp 1s ease both;
    }

    @keyframes fadeUp {
      from { opacity:0; transform: translateY(24px); }
      to   { opacity:1; transform: translateY(0); }
    }

    .logo-area {
      margin-bottom: clamp(32px, 6vh, 60px);
      animation: fadeUp 1s 0.1s ease both;
    }

    .logo-name {
      font-family: 'Jost', sans-serif;
      font-weight: 200;
      font-size: clamp(0.7rem, 1.5vw, 0.85rem);
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: var(--white-60);
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(3.8rem, 12vw, 7.5rem);
      letter-spacing: 0.12em;
      color: var(--white);
      line-height: 0.9;
      margin-bottom: clamp(16px, 2.5vh, 24px);
      animation: fadeUp 1s 0.2s ease both;
    }

    .subtitle {
      font-weight: 300;
      font-size: clamp(0.8rem, 1.8vw, 0.95rem);
      letter-spacing: 0.08em;
      color: var(--white-60);
      line-height: 1.7;
      max-width: 36ch;
      margin-bottom: clamp(36px, 6vh, 56px);
      animation: fadeUp 1s 0.35s ease both;
    }

    /* ── Form wrapper ── */
    .form-wrap {
      width: 100%;
      max-width: 520px;
      animation: fadeUp 1s 0.5s ease both;
    }

    /* Zoho form overrides */
    #crmWebToEntityForm {
      background: transparent !important;
      padding: 0 !important;
      max-width: 100% !important;
      border: none !important;
      box-shadow: none !important;
    }

    /* Hide zoho title */
    #crmWebToEntityForm .zcwf_title { display: none !important; }

    /* Row layout — stack fields side by side */
    #crmWebToEntityForm .zcwf_row {
      display: flex !important;
      gap: 10px !important;
      align-items: flex-end !important;
      flex-wrap: wrap !important;
      margin-bottom: 10px !important;
    }

    #crmWebToEntityForm .zcwf_col_lab {
      display: none !important;
    }

    #crmWebToEntityForm .zcwf_col_fld {
      flex: 1 !important;
      min-width: 140px !important;
    }

    #crmWebToEntityForm .zcwf_col_fld input[type=text],
    #crmWebToEntityForm .zcwf_col_fld input[type=email] {
      width: 100% !important;
      padding: 14px 20px !important;
      background: var(--white-15) !important;
      border: 1px solid var(--white-30) !important;
      border-radius: 100px !important;
      color: var(--white) !important;
      font-family: 'Jost', sans-serif !important;
      font-size: 0.85rem !important;
      font-weight: 300 !important;
      letter-spacing: 0.04em !important;
      outline: none !important;
      transition: border-color 0.2s, background 0.2s !important;
      -webkit-appearance: none !important;
    }

    #crmWebToEntityForm .zcwf_col_fld input[type=text]::placeholder,
    #crmWebToEntityForm .zcwf_col_fld input[type=email]::placeholder {
      color: var(--white-60) !important;
    }

    #crmWebToEntityForm .zcwf_col_fld input[type=text]:focus,
    #crmWebToEntityForm .zcwf_col_fld input[type=email]:focus {
      border-color: var(--white) !important;
      background: var(--white-08) !important;
    }

    /* Submit button */
    #crmWebToEntityForm input[type=submit].formsubmit,
    #crmWebToEntityForm .formsubmit.zcwf_button {
      padding: 14px 28px !important;
      background: var(--dark) !important;
      color: var(--white) !important;
      border: none !important;
      border-radius: 100px !important;
      font-family: 'Jost', sans-serif !important;
      font-size: 0.72rem !important;
      font-weight: 500 !important;
      letter-spacing: 0.2em !important;
      text-transform: uppercase !important;
      cursor: pointer !important;
      white-space: nowrap !important;
      transition: opacity 0.2s !important;
      width: auto !important;
      flex-shrink: 0 !important;
    }

    #crmWebToEntityForm input[type=submit].formsubmit:hover {
      opacity: 0.8 !important;
    }

    /* Privacy note */
    .privacy {
      margin-top: 18px;
      font-size: 0.6rem;
      letter-spacing: 0.08em;
      color: var(--white-60);
      animation: fadeUp 1s 0.65s ease both;
    }
    .privacy a {
      color: var(--white-60);
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .privacy a:hover { color: var(--white); }

    /* Footer */
    .footer-note {
      position: fixed;
      bottom: 24px;
      left: 0; right: 0;
      text-align: center;
      font-size: 0.58rem;
      letter-spacing: 0.12em;
      color: var(--white-30);
      z-index: 10;
      text-transform: uppercase;
    }

    @media (max-width: 500px) {
      #crmWebToEntityForm .zcwf_row {
        flex-direction: column !important;
      }
      #crmWebToEntityForm input[type=submit].formsubmit,
      #crmWebToEntityForm .formsubmit.zcwf_button {
        width: 100% !important;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="logo-area">
      <span class="logo-name">VendorMart</span>
    </div>

    <h1>COMING<br>SOON</h1>

    <p class="subtitle">
      Our website is under construction — follow us for updates now!
    </p>

    <div class="form-wrap">
      <script id="formScript6708968000003386673"

      </script>

      <p class="privacy">
        Protected by reCAPTCHA —
        <a href="https://policies.google.com/privacy" target="_blank">Privacy</a> &amp;
        <a href="https://policies.google.com/terms" target="_blank">Terms</a>
      </p>
    </div>

  </div>

  <p class="footer-note">© 2025 VendorMart. All rights reserved.</p>

  </script>

</body>
</html>
