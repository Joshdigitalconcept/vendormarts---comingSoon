<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VendorMart — Coming Soon</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%230a0a08'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Georgia' font-size='28' font-weight='300' fill='%23f0c040'%3EV%3C/text%3E%3C/svg%3E"/>

  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    html, body {
      width: 100%; height: 100%;
      min-height: 100svh;
      font-family: 'DM Sans', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 70%, #1a1a2e 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      position: relative;
      overflow: hidden;
    }

    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(100,120,255,0.18) 0%, transparent 70%);
      top: -100px; left: -100px;
      animation: drift 12s ease-in-out infinite alternate;
    }
    body::after {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(240,192,64,0.10) 0%, transparent 70%);
      bottom: -80px; right: -80px;
      animation: drift 15s ease-in-out infinite alternate-reverse;
    }

    @keyframes drift {
      from { transform: translate(0, 0); }
      to   { transform: translate(40px, 30px); }
    }

    .content {
      position: relative;
      z-index: 1;
      max-width: 520px;
      width: 100%;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.32);
      margin-bottom: 56px;
      opacity: 0;
      animation: up 0.8s ease 0.1s forwards;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2.8rem, 9vw, 5rem);
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #ffffff;
      line-height: 1;
      margin-bottom: 20px;
      opacity: 0;
      animation: up 0.9s ease 0.25s forwards;
    }

    .sub {
      font-size: clamp(0.88rem, 2.5vw, 1rem);
      font-weight: 300;
      color: rgba(255,255,255,0.48);
      margin-bottom: 48px;
      line-height: 1.7;
      opacity: 0;
      animation: up 0.9s ease 0.4s forwards;
    }

    .form-wrap {
      opacity: 0;
      animation: up 0.9s ease 0.55s forwards;
    }

    .form-label {
      font-size: 0.63rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.28);
      margin-bottom: 14px;
    }

    .waitlist-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .waitlist-form input {
      width: 100%;
      padding: 14px 22px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 100px;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 300;
      outline: none;
      transition: border-color 0.25s, background 0.25s;
    }

    .waitlist-form input::placeholder {
      color: rgba(255,255,255,0.3);
    }

    .waitlist-form input:focus {
      border-color: rgba(255,255,255,0.28);
      background: rgba(255,255,255,0.10);
    }

    .waitlist-form button {
      width: 100%;
      padding: 15px 32px;
      background: #ffffff;
      color: #0f1929;
      border: none;
      border-radius: 100px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 4px;
      transition: opacity 0.2s, transform 0.15s;
    }

    .waitlist-form button:hover { opacity: 0.88; }
    .waitlist-form button:active { transform: scale(0.98); }

    .waitlist-form button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .msg {
      margin-top: 14px;
      font-size: 0.82rem;
      font-weight: 400;
      min-height: 20px;
      letter-spacing: 0.02em;
      transition: opacity 0.3s;
    }
    .msg.success { color: #7ee8a2; }
    .msg.error   { color: #ff8a8a; }

    footer {
      position: fixed;
      bottom: 22px;
      left: 0; right: 0;
      text-align: center;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      color: rgba(255,255,255,0.18);
      z-index: 1;
    }

    @keyframes up {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="content">
    <div class="logo">VendorMart</div>
    <h1>COMING SOON</h1>
    <p class="sub">
      A next-generation marketplace for serious vendors<br/>and smart buyers. Something big is on the way.
    </p>

    <div class="form-wrap">
      <div class="form-label">Join the waitlist</div>

      <form class="waitlist-form" id="waitlistForm" novalidate>
        <input type="text"  id="firstName" name="First Name"  placeholder="First name"    autocomplete="given-name"  required/>
        <input type="text"  id="lastName"  name="Last Name"   placeholder="Last name"     autocomplete="family-name" required/>
        <input type="email" id="email"     name="Email"       placeholder="Email address" autocomplete="email"       required/>
        <input type="tel"   id="phone"     name="Phone"       placeholder="Phone number (optional)" autocomplete="tel"/>
        <button type="submit" id="submitBtn">Get Early Access</button>
        <div class="msg" id="formMsg"></div>
      </form>
    </div>
  </div>

  <footer>© 2025 VendorMart. All Rights Reserved.</footer>

  <script>
    const form = document.getElementById('waitlistForm');
    const btn  = document.getElementById('submitBtn');
    const msg  = document.getElementById('formMsg');

    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      const first = document.getElementById('firstName').value.trim();
      const last  = document.getElementById('lastName').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();

      if (!first || !last || !email) {
        msg.textContent = 'Please fill in your name and email.';
        msg.className = 'msg error';
        return;
      }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        msg.textContent = 'Please enter a valid email address.';
        msg.className = 'msg error';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Submitting…';
      msg.textContent = '';
      msg.className = 'msg';

      /* Zoho CRM Web-to-Lead endpoint extracted from the original form script */
      const zohoEndpoint = 'https://crm.zoho.com/crm/WebToLeadForm';

      const body = new URLSearchParams({
        'xnQsjsdp':    '0ed3da376a8b09054ce27cdc7c531f56c60e9fc5e3e5f061b2d3da6e857822b719f88b8f195ad8d458813b3f1227c3d4',
        'zc_gad':      '',
        'xmIwtLD':     '77604f6404bedfec83630f28a20378c1c3fe781a89e166ee744fce7ccf108055',
        'actionType':  'TGVhZHM=',
        'returnURL':   'https://vendormart.com',
        'First Name':  first,
        'Last Name':   last,
        'Email':       email,
        'Phone':       phone,
      });

      try {
        /* Zoho doesn't support CORS on this endpoint, so we use a hidden iframe
           to submit — the standard technique for Zoho Web-to-Lead forms.       */
        const iframe = document.createElement('iframe');
        iframe.name = 'zoho_frame';
        iframe.style.display = 'none';
        document.body.appendChild(iframe);

        const hiddenForm = document.createElement('form');
        hiddenForm.method  = 'POST';
        hiddenForm.action  = zohoEndpoint;
        hiddenForm.target  = 'zoho_frame';

        body.forEach((value, key) => {
          const input = document.createElement('input');
          input.type  = 'hidden';
          input.name  = key;
          input.value = value;
          hiddenForm.appendChild(input);
        });

        document.body.appendChild(hiddenForm);
        hiddenForm.submit();

        /* Give Zoho a moment, then show success */
        setTimeout(() => {
          msg.textContent = '🎉 You\'re on the list! We\'ll be in touch.';
          msg.className = 'msg success';
          form.reset();
          btn.disabled = false;
          btn.textContent = 'Get Early Access';
          hiddenForm.remove();
          setTimeout(() => iframe.remove(), 3000);
        }, 1200);

      } catch (err) {
        msg.textContent = 'Something went wrong. Please try again.';
        msg.className = 'msg error';
        btn.disabled = false;
        btn.textContent = 'Get Early Access';
      }
    });
  </script>
</body>
</html>
